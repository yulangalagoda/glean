repos:
  # Pinned to the exact version pyproject.toml's dev extra installs (ruff,
  # mypy) — a version drift between this isolated hook environment and the
  # project .venv/CI has already caused a real, confusing hook-only failure
  # once (mypy) and a latent one (ruff, unnoticed only by luck). Bump both
  # together, deliberately, not independently.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(src|tests)/
      - id: ruff-format
        files: ^(src|tests)/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        # This hook runs in its own isolated env, separate from the project
        # .venv — every runtime dependency mypy needs to resolve types for
        # (plus its stub package, if the library isn't inline-typed) must be
        # listed explicitly here, matching pyproject.toml's [project]
        # dependencies. Forgetting one here (not pyproject.toml) is exactly
        # what caused the pyyaml and typer hook-only failures.
        additional_dependencies: ["pyyaml>=6.0", "types-PyYAML>=6.0", "typer==0.27.0"]
        files: ^src/
