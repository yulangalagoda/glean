[project]
name = "glean-osint"
version = "0.2.0"
description = "Glean — OSINT synthesis: unify open-source recon tools into one provenance-tracked, LLM-prioritised intelligence report."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yulan Galagoda" }]
keywords = ["osint", "reconnaissance", "threat-intelligence", "security"]
dependencies = [
    "pyyaml>=6.0",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.scripts]
# Two names for one entry point, on purpose. PyPI's existing `glean`
# package (an OpenStack config tool) also installs a console script called
# `glean`, and console scripts are just files in the environment's bin
# directory -- so whichever package is installed *last* silently overwrites
# the other, with no warning from pip and no error at run time. Verified
# both ways in a throwaway venv: the winner flips on any reinstall or
# upgrade of either package.
#
# `glean` stays the primary name because it is what every doc and the
# equivalent-command preview print. `glean-osint` is the escape hatch that
# cannot be shadowed, matching the distribution name so it is guessable
# without being looked up.
glean = "glean_osint.cli:main"
glean-osint = "glean_osint.cli:main"

[project.optional-dependencies]
dev = [
    "ruff==0.16.0",
    "mypy==2.3.0",
    "pytest>=8.0",
    "pre-commit>=3.7",
    "jsonschema>=4.22",
    "types-PyYAML>=6.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/yulangalagoda/glean"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"glean_osint.web" = ["templates/*.html", "static/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
