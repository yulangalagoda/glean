name: publish

# Publishing is driven by the tag, not by a person running twine locally.
# The artifact is then built from exactly the commit that was tagged, rather
# than from whatever happened to be in someone's working tree -- which is
# the failure mode that puts an unreproducible build on PyPI.
on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

jobs:
  # A tag is not evidence that the code works. This re-runs the same gate
  # `ci.yml` applies to main, against the tagged commit specifically, so a
  # tag pushed from a branch that never passed CI cannot reach PyPI.
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package with dev extras
        run: python -m pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check src tests
      - name: Ruff (format check)
        run: ruff format --check src tests
      - name: mypy
        run: mypy src
      - name: pytest
        run: pytest

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Catches the mistake this project would otherwise make quietly:
      # tagging v0.1.1 while the package still says 0.1.0, publishing a
      # version whose own metadata disagrees with its tag. Cheap to check,
      # effectively unfixable once uploaded -- PyPI does not allow
      # re-uploading a version.
      - name: Tag must match the package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import re,pathlib;\
          print(re.search(r'^__version__ = \"([^\"]+)\"', \
          pathlib.Path('src/glean_osint/__init__.py').read_text(), re.M).group(1))")
          echo "tag=$TAG package=$PKG"
          test "$TAG" = "$PKG"

      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build

      # The packaging guard already asserts this on every push; repeated
      # here because this is the artifact that actually leaves the machine.
      - name: Assert docs / CHARTER / _private never ship
        run: |
          python - <<'PY'
          import pathlib, sys, tarfile, zipfile
          bad = []
          for whl in pathlib.Path("dist").glob("*.whl"):
              bad += [n for n in zipfile.ZipFile(whl).namelist()
                      if n.startswith(("docs/", "_private/")) or "CHARTER" in n]
          for sd in pathlib.Path("dist").glob("*.tar.gz"):
              bad += [n for n in tarfile.open(sd).getnames()
                      if "/docs/" in n or "/_private/" in n or "CHARTER" in n]
          if bad:
              sys.exit("would publish private files: " + ", ".join(bad))
          print("clean")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    # Named so PyPI's trusted publisher can be scoped to it, and so the
    # repo can require a manual approval before anything is uploaded.
    environment: pypi
    permissions:
      # The whole point of trusted publishing: GitHub mints a short-lived
      # OIDC token PyPI verifies against the configured publisher, so no
      # long-lived API token is stored in this repo at all.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          --title "$GITHUB_REF_NAME"
          --notes "See CHANGELOG.md for the full entry, including the audit
          against the charter's MVP criteria and the stated limitations of
          the faithfulness numbers."
          dist/*
