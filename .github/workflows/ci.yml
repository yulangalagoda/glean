name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package with dev extras
        run: python -m pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check src tests
      - name: Ruff (format check)
        run: ruff format --check src tests
      - name: mypy
        run: mypy src
      - name: pytest
        run: pytest

  # NOTE (roadmap Workstream E3): once the evaluation harness exists, add a job
  # here that runs it against a committed fixture target so the three headline
  # numbers (faithfulness, prioritisation quality, provenance retention) are
  # regenerated on every change and a regression fails the build. Not added
  # yet because the harness doesn't exist yet — see ADR-0006/0007.
