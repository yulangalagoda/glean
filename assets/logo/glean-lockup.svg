<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 32" width="132" height="32"
     role="img" aria-labelledby="glean-lockup-title">
  <title id="glean-lockup-title">Glean</title>
  <!--
    Horizontal lockup: mark + wordmark.

    Spacing rule, so this can be rebuilt at any size: the gap between mark
    and wordmark is 0.3 × the mark's height (32 × 0.3 ≈ 9.6, rounded to 10),
    and clear space around the whole lockup is one full mark-height on every
    side. Keep those ratios and it will never look crowded.

    NOTE — the wordmark is live <text>, not outlines. That means it renders
    with whatever the system resolves from the font stack, so it will differ
    slightly across machines. For anything final (a README header, a site
    header, print) open this in Inkscape/Figma/Illustrator and convert the
    text to a path. Live text is kept here on purpose so you can still
    re-letterspace or swap the typeface before committing to outlines.
  -->
  <g>
    <g fill="currentColor" opacity="0.5">
      <circle cx="16"    cy="4.5"   r="2.5"/>
      <circle cx="25.96" cy="10.25" r="2.25"/>
      <circle cx="25.96" cy="21.75" r="2"/>
      <circle cx="16"    cy="27.5"  r="1.75"/>
      <circle cx="6.04"  cy="21.75" r="1.5"/>
      <circle cx="6.04"  cy="10.25" r="1.3"/>
    </g>
    <circle cx="16" cy="16" r="4.6" fill="#2a5adb"/>
  </g>
  <text x="42" y="16" fill="currentColor"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="21" font-weight="640" letter-spacing="-0.6"
        dominant-baseline="central">glean</text>
</svg>
