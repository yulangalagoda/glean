<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32"
     role="img" aria-labelledby="glean-mono-title">
  <title id="glean-mono-title">Glean</title>
  <!--
    Single-colour variant. Everything is `currentColor`; hierarchy is carried
    by size and opacity alone, never by hue.

    Use this anywhere colour will not survive: engraving, one-colour print,
    a favicon mask, an OS tinting the icon, or any surface where the accent
    would clash. It is also the accessibility fallback — the mark never
    depends on colour to be readable.
  -->
  <g fill="currentColor">
    <g opacity="0.45">
      <circle cx="16"    cy="4.5"   r="2.5"/>
      <circle cx="25.96" cy="10.25" r="2.25"/>
      <circle cx="25.96" cy="21.75" r="2"/>
      <circle cx="16"    cy="27.5"  r="1.75"/>
      <circle cx="6.04"  cy="21.75" r="1.5"/>
      <circle cx="6.04"  cy="10.25" r="1.3"/>
    </g>
    <circle cx="16" cy="16" r="4.6"/>
  </g>
</svg>
