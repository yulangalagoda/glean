<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="256" height="256"
     role="img" aria-labelledby="glean-logo-title">
  <title id="glean-logo-title">Glean</title>
  <!--
    GLEAN — static logo. "The Gather": six sources, ranked by weight,
    resolving into one judgment.

    Dot radii descend clockwise from the top (2.5 -> 1.3). That ranking is
    what keeps the mark from reading as a paused loading spinner: hierarchy
    is visible even at rest, which is the whole point of the product.
    The centre is the only element in accent colour, because it is the one
    element that means "this is the answer".

    Colours are explicit so this renders correctly anywhere: as an img src,
    in a README, as a favicon, in a slide deck. If you inline this into HTML
    and want it to follow the surrounding text colour instead, change the
    ring fill to currentColor and point the centre fill at your accent CSS
    custom property.

    Dark backgrounds: swap #1a1a1a for #e8e8e8, and #2a5adb for #7db8ff.

    Scales to any size — it is pure geometry on a 32-unit grid. Below 16px,
    use the centre dot alone.
  -->
  <g fill="#1a1a1a" opacity="0.5">
    <circle cx="16"    cy="4.5"   r="2.5"/>
    <circle cx="25.96" cy="10.25" r="2.25"/>
    <circle cx="25.96" cy="21.75" r="2"/>
    <circle cx="16"    cy="27.5"  r="1.75"/>
    <circle cx="6.04"  cy="21.75" r="1.5"/>
    <circle cx="6.04"  cy="10.25" r="1.3"/>
  </g>
  <circle cx="16" cy="16" r="4.6" fill="#2a5adb"/>
</svg>
