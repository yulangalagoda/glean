<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32"
     role="img" aria-labelledby="glean-mark-title">
  <title id="glean-mark-title">Glean</title>
  <!--
    The Gather. Six sources ranked by weight, resolving into one judgment.

    Outer dots use `currentColor` so the mark inherits whatever text colour
    it sits in — one file works on light, dark, and any accent background.
    Only the centre is a fixed accent, because it is the one element whose
    meaning is "this is the answer".

    Dot radii descend clockwise from the top (2.5 → 1.3). That ranking is
    what stops the static mark reading as a loading spinner someone paused.
  -->
  <g fill="currentColor" opacity="0.5">
    <circle cx="16"    cy="4.5"   r="2.5"/>
    <circle cx="25.96" cy="10.25" r="2.25"/>
    <circle cx="25.96" cy="21.75" r="2"/>
    <circle cx="16"    cy="27.5"  r="1.75"/>
    <circle cx="6.04"  cy="21.75" r="1.5"/>
    <circle cx="6.04"  cy="10.25" r="1.3"/>
  </g>
  <circle cx="16" cy="16" r="4.6" fill="#2a5adb"/>
</svg>
