<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Glean{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="site-header">
  <nav class="nav">
    <a class="nav-brand" href="/">Glean</a>
    <div class="nav-links">
      <a href="/" class="{{ 'active' if request.url.path == '/' else '' }}">New scan</a>
      <a href="/history" class="{{ 'active' if request.url.path == '/history' else '' }}">History</a>
    </div>
  </nav>
</header>
<main class="page">
{% block content %}{% endblock %}
</main>
</body>
</html>
