<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32"
     role="img" aria-labelledby="glean-favicon-dark-title">
  <title id="glean-favicon-dark-title">Glean</title>
  <!--
    Dark-mode favicon. Same optical geometry as glean-favicon.svg, with the
    ring lifted to a light ink and the accent brightened to the palette's
    dark-mode blue (#7db8ff) — the light-mode #2a5adb sits too close to a
    dark browser chrome to read.

    Serve alongside the light one:
      <link rel="icon" href="glean-favicon.svg"
            media="(prefers-color-scheme: light)">
      <link rel="icon" href="glean-favicon-dark.svg"
            media="(prefers-color-scheme: dark)">
  -->
  <g fill="#e8e8e8" opacity="0.55">
    <circle cx="16"   cy="5.2"  r="2.6"/>
    <circle cx="25.4" cy="10.6" r="2.6"/>
    <circle cx="25.4" cy="21.4" r="2.6"/>
    <circle cx="16"   cy="26.8" r="2.6"/>
    <circle cx="6.6"  cy="21.4" r="2.6"/>
    <circle cx="6.6"  cy="10.6" r="2.6"/>
  </g>
  <circle cx="16" cy="16" r="6" fill="#7db8ff"/>
</svg>
